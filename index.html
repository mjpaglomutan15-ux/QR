<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffaf0">
  <meta name="description" content="ASB account details for Mj Paglomutan.">
  <title>ASB Account Details | Mj Paglomutan</title>
  <style>
    :root {
      --gold: #ffb900;
      --gold-dark: #bd8610;
      --ink: #302a20;
      --muted: #827866;
      --paper: rgba(255,255,255,.93);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 34px 18px;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #fffdf8;
      background-image: url("background.png");
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
    }
    .page {
      width: min(100%, 490px);
      padding: 34px 34px 30px;
      border: 1px solid rgba(211,164,70,.34);
      border-radius: 22px;
      background: var(--paper);
      box-shadow: 0 18px 60px rgba(88,67,26,.13);
      backdrop-filter: blur(7px);
      text-align: center;
    }
    .logo-wrap {
      width: 174px;
      max-width: 58%;
      margin: 0 auto 25px;
    }
    .logo { display: block; width: 100%; height: auto; }
    .eyebrow {
      margin: 0 0 9px;
      color: var(--gold-dark);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(27px, 6vw, 35px);
      font-weight: 500;
      letter-spacing: -.035em;
    }
    .intro {
      margin: 10px 0 27px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .details {
      display: grid;
      gap: 13px;
      text-align: left;
    }
    .detail {
      padding: 17px 17px 16px;
      border: 1px solid rgba(194,151,64,.25);
      border-radius: 13px;
      background: rgba(255,252,245,.9);
    }
    .detail-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
    }
    .label {
      color: #8a795c;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .value {
      overflow-wrap: anywhere;
      font-size: 19px;
      font-weight: 650;
      letter-spacing: .015em;
      font-variant-numeric: tabular-nums;
    }
    .copy-small {
      flex: 0 0 auto;
      border: 1px solid rgba(189,134,16,.38);
      border-radius: 7px;
      padding: 6px 10px;
      color: #805b0a;
      background: #fff8e8;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }
    button:hover { background: #ffefc5; }
    button:active { transform: scale(.97); }
    .copy-all {
      width: 100%;
      margin-top: 19px;
      padding: 15px 20px;
      border: 0;
      border-radius: 10px;
      color: #30250b;
      background: var(--gold);
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .02em;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(219,158,0,.2);
      transition: filter .18s ease, transform .18s ease;
    }
    .copy-all:hover { filter: brightness(1.04); background: #ffc52e; }
    .copy-all:active { transform: translateY(1px); }
    .status {
      min-height: 20px;
      margin: 11px 0 0;
      color: #6c571e;
      font-size: 12px;
    }
    .footer {
      margin: 20px 0 0;
      color: #9b907c;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      font-style: italic;
    }
    @media (max-width: 480px) {
      body { padding: 18px 13px; background-attachment: scroll; }
      .page { padding: 27px 19px 23px; border-radius: 18px; }
      .logo-wrap { width: 150px; margin-bottom: 21px; }
      .detail { padding: 15px 13px; }
      .value { font-size: 17px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="logo-wrap">
      <img class="logo" src="asb-logo.png" alt="ASB logo">
    </div>

    <p class="eyebrow">Bank account details</p>
    <h1>Account Information</h1>
    <p class="intro">Please use the details below when making a bank transfer.</p>

    <section class="details" aria-label="ASB account details">
      <div class="detail">
        <div class="detail-top">
          <span class="label">Account name</span>
          <button class="copy-small" type="button" data-copy="Mj Paglomutan">Copy</button>
        </div>
        <div class="value">Mj Paglomutan</div>
      </div>

      <div class="detail">
        <div class="detail-top">
          <span class="label">Account number</span>
          <button class="copy-small" type="button" data-copy="12-3602-0250510-50">Copy</button>
        </div>
        <div class="value">12-3602-0250510-50</div>
      </div>
    </section>

    <button class="copy-all" id="copyAll" type="button">Copy All Account Details</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="footer">Thank you</p>
  </main>

  <script>
    const statusMessage = document.getElementById('status');

    async function copyText(text, message) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const field = document.createElement('textarea');
          field.value = text;
          field.setAttribute('readonly', '');
          field.style.position = 'fixed';
          field.style.opacity = '0';
          document.body.appendChild(field);
          field.select();
          const copied = document.execCommand('copy');
          field.remove();
          if (!copied) throw new Error('Copy was not successful');
        }
        statusMessage.textContent = message;
      } catch (error) {
        statusMessage.textContent = 'Copy unavailable. Please select and copy the details manually.';
      }
    }

    document.querySelectorAll('[data-copy]').forEach((button) => {
      button.addEventListener('click', () => {
        copyText(button.dataset.copy, 'Copied to clipboard!');
      });
    });

    document.getElementById('copyAll').addEventListener('click', () => {
      const allDetails = 'Account Name: Mj Paglomutan\nAccount Number: 12-3602-0250510-50';
      copyText(allDetails, 'All account details copied!');
    });
  </script>
</body>
</html>
